spring.application.name=iceberg-orderbook
# local durable log directory (no external services)
orderbook.wal-dir=${ORDERBOOK_WAL_DIR:data/orderbook-wal}
orderbook.depth-levels=20
orderbook.symbols.BTC-USD.min-visible-qty=1
orderbook.symbols.BTC-USD.replenish-granularity=1
orderbook.symbols.BTC-USD.max-qty=1000000000
orderbook.symbols.ETH-USD.min-visible-qty=1
orderbook.symbols.ETH-USD.replenish-granularity=1
orderbook.symbols.ETH-USD.max-qty=1000000000
