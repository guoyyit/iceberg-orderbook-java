# ---- Iceberg order book matching configuration ----
# Per-symbol WAL directory (each symbol gets its own <SYMBOL>.wal file)
matching.wal-dir=data/wal
# fsync every committed request batch (set false only for tests / ephemeral runs)
matching.fsync=true
# Iceberg display/replenishment granularity defaults and bounds
matching.default-peak-size=100
matching.min-peak-size=1
matching.max-peak-size=1000000000
